services:
  - type: web
    name: agenda-pro
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "18"
      - key: DATABASE_URL
        fromDatabase:
          name: agenda-pro-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: agenda-pro-db
    databaseName: agenda_pro
    user: postgres
